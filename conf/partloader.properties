#
# Windchill Part Loader - runtime configuration
#
# This file is read on the METHOD SERVER host. Keep one file per environment and never
# copy a PROD file into DEV: the container names differ, and a loader pointed at the wrong
# container is discovered late and cleaned up slowly.
#

# ---------------------------------------------------------------- input format
loader.csv.charset            = UTF-8
loader.csv.delimiter          = ,

# ---------------------------------------------------------------- defaults
# Applied when the corresponding CSV column is absent or empty. Anything set here can be
# overridden per row, which is what lets one file span several products.
loader.default.containerType  = PRODUCT
loader.default.containerName  =
loader.default.folderPath     = /Default
loader.default.view           = Design
loader.default.source         = make
loader.default.unit           = ea
loader.default.partType       = separable
loader.default.traceCode      =

# ---------------------------------------------------------------- behaviour
# Update parts that already exist. FALSE is the safe default: an accidental re-run then
# reports SKIPPED instead of iterating every part in the file and filling the audit trail
# with meaningless revisions.
loader.update.existing        = false

# Create missing folders instead of failing the row. Leave FALSE in production - a typo in
# the folder column otherwise builds a parallel folder tree with the wrong access rules.
loader.folder.autoCreate      = false

# Add usage links whose child is already present under the parent.
loader.bom.updateExistingLinks = false

# ---------------------------------------------------------------- data quality
# TRUE: an unknown soft attribute fails the row. Keep it TRUE. Setting it FALSE means the
# loader reports success while silently dropping attribute values, which is the failure
# mode nobody notices until the ERP interface starts rejecting parts.
loader.iba.strict             = true

# ---------------------------------------------------------------- error handling
# Abort on the first failure. Useful for the first validation pass over a new file,
# unhelpful for a bulk run where you want the whole error list in one report.
loader.stopOnError            = false

# Abort once this many rows have failed. -1 = never abort on count alone. A sensible value
# for a migration wave is ~2% of the file: past that the file itself is wrong and there is
# no point loading the rest.
loader.maxErrors              = -1

# ---------------------------------------------------------------- lifecycle
# Direct lifecycle state assignment BYPASSES workflow entirely - no approvals, no history.
# Legitimate for legacy migration, an audit finding almost anywhere else. Read the class
# comment in LifecycleUtil.java before turning this on, and record the decision.
loader.lifecycle.allowDirectStateAssignment = false

# ---------------------------------------------------------------- output
loader.report.dir             = /opt/ptc/Windchill/loadFiles/reports
loader.checkin.note           = Loaded by Part Loader utility
loader.progress.interval      = 100
loader.debug                  = false
